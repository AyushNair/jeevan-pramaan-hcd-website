<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeevan Pramaan — plain-language rejection prototype</title>
<style>
  :root{
    --ink:#1c1c1a;
    --muted:#5f5e5a;
    --bg:#f7f6f2;
    --card:#ffffff;
    --red:#a32d2d;
    --red-bg:#fcebeb;
    --green:#0f6e56;
    --green-bg:#e1f5ee;
    --border:#d3d1c7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  header{
    width:100%;
    max-width:420px;
    margin-bottom:16px;
  }
  h1{
    font-size:18px;
    font-weight:600;
    margin:0 0 4px;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0;
  }
  .toggle-row{
    width:100%;
    max-width:420px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:20px;
    font-size:15px;
  }
  .switch{
    position:relative;
    width:52px;
    height:30px;
    flex-shrink:0;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;inset:0;
    background:#b4b2a9;
    border-radius:30px;
    cursor:pointer;
    transition:.2s;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:24px;width:24px;
    left:3px;top:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
  }
  input:checked + .slider{background:var(--green);}
  input:checked + .slider:before{transform:translateX(22px);}

  .phone{
    width:100%;
    max-width:340px;
    min-height:560px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 2px 14px rgba(0,0,0,0.06);
  }
  .icon{
    width:88px;height:88px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:28px;
  }
  .icon svg{width:46px;height:46px;}
  .icon.err{background:var(--red-bg);}
  .icon.ok{background:var(--green-bg);}

  .camera-box{
    width:220px;height:220px;
    border-radius:16px;
    background:#2c2c2a;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:28px;
    position:relative;
  }
  .camera-box svg{width:64px;height:64px;opacity:.5;}
  .camera-box .oval{
    position:absolute;
    width:120px;height:150px;
    border:3px dashed rgba(255,255,255,0.55);
    border-radius:50%;
  }

  h2{
    font-size:26px;
    font-weight:700;
    margin:0 0 12px;
    line-height:1.25;
  }
  p.detail{
    font-size:18px;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 36px;
    max-width:260px;
  }
  button.primary{
    width:100%;
    max-width:260px;
    min-height:60px;
    border:none;
    border-radius:14px;
    font-size:19px;
    font-weight:600;
    color:white;
    cursor:pointer;
  }
  button.primary.cta{background:var(--ink);}
  button.primary.retake{background:var(--green);}
  button.primary.retry{background:var(--red);}
  button.primary.done{background:var(--green);}
  button.primary:active{opacity:.85;}

  .hint{
    margin-top:18px;
    font-size:14px;
    color:var(--muted);
  }
  footer{
    margin-top:24px;
    font-size:12px;
    color:var(--muted);
    max-width:340px;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>Jeevan Pramaan prototype</h1>
  <p class="sub">Idea: a specific, plain-language reason instead of a generic rejection</p>
</header>

<div class="toggle-row">
  <span id="toggleLabel">Compare with old version</span>
  <label class="switch">
    <input type="checkbox" id="oldToggle">
    <span class="slider"></span>
  </label>
</div>

<div class="phone" id="phone"></div>

<footer>
  Lo-fi functional prototype — demonstrates Idea #1 from the Idea Selection Matrix (Page 25).
  Not connected to any real authentication system.
</footer>

<script>
const REASONS = [
  { title: "Photo too dark", detail: "Move to a brighter spot and take the photo again." },
  { title: "Face not fully visible", detail: "Make sure your whole face is inside the circle, then try again." },
  { title: "Too much glare", detail: "Step away from bright light behind you and take the photo again." }
];

const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`;
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9,18 20,6"/></svg>`;
const ICON_CAMERA = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="4"/></svg>`;

let state = "capture"; // capture -> rejected -> success
let currentReason = REASONS[0];
const phone = document.getElementById("phone");
const oldToggle = document.getElementById("oldToggle");

function render() {
  const showOld = oldToggle.checked;

  if (state === "capture") {
    phone.innerHTML = `
      <div class="camera-box">
        <div class="oval"></div>
        ${ICON_CAMERA}
      </div>
      <h2>Take your photo</h2>
      <p class="detail">Hold the phone steady and look at the camera.</p>
      <button class="primary cta" id="captureBtn">Take Photo</button>
    `;
    document.getElementById("captureBtn").onclick = () => {
      // simulate: first attempt rejects, to show the core function
      currentReason = REASONS[Math.floor(Math.random() * REASONS.length)];
      state = "rejected";
      render();
    };
    return;
  }

  if (state === "rejected") {
    if (showOld) {
      phone.innerHTML = `
        <div class="icon err" style="color:var(--red)">${ICON_X}</div>
        <h2>Verification Failed</h2>
        <p class="detail">Please try again.</p>
        <button class="primary retry" id="retryBtn">Retry</button>
        <div class="hint">(today's version — no reason given)</div>
      `;
      document.getElementById("retryBtn").onclick = () => { state = "capture"; render(); };
    } else {
      phone.innerHTML = `
        <div class="icon err" style="color:var(--red)">${ICON_X}</div>
        <h2>${currentReason.title}</h2>
        <p class="detail">${currentReason.detail}</p>
        <button class="primary retake" id="retakeBtn">Retake Photo</button>
      `;
      document.getElementById("retakeBtn").onclick = () => { state = "success"; render(); };
    }
    return;
  }

  if (state === "success") {
    phone.innerHTML = `
      <div class="icon ok" style="color:var(--green)">${ICON_CHECK}</div>
      <h2>Certificate submitted</h2>
      <p class="detail">Your life certificate has been submitted successfully.</p>
      <button class="primary done" id="doneBtn">Done</button>
    `;
    document.getElementById("doneBtn").onclick = () => { state = "capture"; render(); };
    return;
  }
}

oldToggle.addEventListener("change", render);
render();
</script>

</body>
</html>
